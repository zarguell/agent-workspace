apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  database-url: {{ printf "postgresql+asyncpg://%s:%s@postgres:5432/%s" .Values.postgres.user (required "postgres.password must be set" .Values.postgres.password) .Values.postgres.database | quote }}
  postgres-user: {{ .Values.postgres.user | quote }}
  postgres-password: {{ required "postgres.password must be set" .Values.postgres.password | quote }}
  postgres-db: {{ .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: service-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  token: {{ required "serviceAuthToken must be set" .Values.serviceAuthToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: seed-admin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: agent-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  password: {{ required "seedAdminPassword must be set" .Values.seedAdminPassword | quote }}
