# Local deployment overrides for agent-platform Helm chart.
#
# Copy this file to values.local.yaml (gitignored via *.local.yaml)
# and fill in your secrets. Then:
#   helm install agent-platform charts/agent-platform -f values.local.yaml
#
# Images are expected to be built and pushed to the local registry
# before deploying (see scripts/build-images.sh or docker compose).

baseDomain: example.com

images:
  controlPlane: localhost:5000/agent-control-plane
  gateway: localhost:5000/agent-gateway
  workspace: localhost:5000/agent-workspace
  tag: dev

network:
  # Namespaces allowed to reach the gateway directly (allow-to-gateway
  # NetworkPolicy). Traefik runs in kube-system on stock k3s; override if
  # your ingress controller is deployed elsewhere.
  ingressControllerNamespaces:
    - kube-system

postgres:
  user: agentplatform
  password: "CHANGE_ME"                # ⚠ set a strong password
  database: agentplatform
  storage: 10Gi
  storageClass: local-path

serviceAuthToken: "CHANGE_ME"          # ⚠ shared secret between gateway and control-plane

seedAdminPassword: "CHANGE_ME"         # ⚠ initial admin password (first boot only)

idleTimeoutMinutes: 15                 # workspace hibernation after N min idle

# Optional HTTPS via Traefik websecure entrypoint.
# Local self-signed: run scripts/generate-selfsigned-cert.sh, then enable.

# Pod resource requests/limits — tune for your hardware
resources:
  controlPlane:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  gateway:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  postgres:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

  # Namespace-wide ResourceQuota ceilings (default-deny). Keep these >= the
  # sum of the deployment limits above + headroom (and >= postgres.storage)
  # or pods/PVCs will fail to schedule/create.
  platformNamespace:
    quota:
      cpu: 4500m
      memory: 9Gi
      storage: 12Gi

workspaceDefaults:
  storageSize: 10Gi
  storageClass: local-path
  resourceRequests:
    cpu: 512m
    memory: 1Gi
  resourceLimits:
    cpu: 2
    memory: 4Gi
