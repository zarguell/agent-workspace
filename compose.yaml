name: agent-platform-local

# Local development stack: Postgres + control plane + gateway + mock IdP.
# No Kubernetes required. Workspace *pods* remain a K8s concept — to run the
# full Canvas/code-server flow locally, point WORKSPACE_DEV_HOST at any
# container exposing the workspace ports (6767/8080/8000/9000); the control
# plane then routes to it instead of a ClusterIP.
#
#   docker compose up --build
#   open http://localhost:${GATEWAY_PORT:-18088}/ui/login
#
# Env overrides: SERVICE_AUTH_TOKEN, SEED_ADMIN_USER, SEED_ADMIN_PASSWORD,
# CORS_ORIGINS, WORKSPACE_DEV_HOST, CONTROL_PLANE_PORT, GATEWAY_PORT,
# POSTGRES_PORT, OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET,
# OIDC_REDIRECT_URI, OIDC_ADMIN_EMAILS.
# (Set them in a .env file next to this file.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentplatform
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build: ./services/control-plane
    environment:
      DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agentplatform
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-local-token}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin}
      # Comma-separated list of allowed browser origins (e.g. the gateway
      # UI origin). Empty disables cross-origin requests entirely.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DISABLE_RECONCILER: "1"
      WORKSPACE_DEV_HOST: ${WORKSPACE_DEV_HOST:-}
      # Fernet master key for workspace-secret encryption at rest. Change in
      # production; changing it makes existing secrets unreadable.
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-MnWVZmo5ijMYKILJWi-UxcsMiVLZIwVU8IZ_ixbVhrU=}
      # OIDC SSO (optional). OIDC_ISSUER must be reachable from the BROWSER;
      # OIDC_DISCOVERY_URL lets this container fetch discovery/tokens on a
      # different URL (the mock-idp service on the compose network).
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:18099}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-http://mock-idp:18099/.well-known/openid-configuration}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-local-client}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-secret}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://agents.local.test:${GATEWAY_PORT:-18088}/api/oidc/callback}
      OIDC_ADMIN_EMAILS: ${OIDC_ADMIN_EMAILS:-admin@example.com}
      # Dev-only: the mock IdP is plain HTTP; production must use HTTPS.
      OIDC_ALLOW_INSECURE: "1"
    ports:
      - "${CONTROL_PLANE_PORT:-18011}:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build: ./services/gateway
    environment:
      CONTROL_PLANE_URL: http://control-plane:80
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-local-token}
      # Empty domain → host-only session cookie, so localhost / agents.local.test work.
      COOKIE_DOMAIN: ""
    ports:
      - "${GATEWAY_PORT:-18088}:80"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Mock OIDC identity provider for local SSO demos (scripts/mock-oidc-idp.py).
  # Reuses the control-plane image (it ships uvicorn + joserfc + cryptography).
  # The browser reaches it via the published port; the control plane reaches
  # it as `mock-idp` on the compose network (OIDC_DISCOVERY_URL).
  mock-idp:
    image: agent-platform-local-control-plane
    command: ["python", "/scripts/mock-oidc-idp.py", "--issuer", "http://127.0.0.1:18099", "--internal-base", "http://mock-idp:18099", "--port", "18099"]
    volumes:
      - ./scripts:/scripts:ro
    ports:
      - "18099:18099"

volumes:
  pgdata:
