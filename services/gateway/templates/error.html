<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace Unavailable — Agent Workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0; display: flex; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0;
  }
  .card {
    background: #1e293b; border-radius: 12px; padding: 2.5rem;
    width: 100%; max-width: 480px; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    text-align: center;
  }
  .icon { font-size: 2.5rem; margin-bottom: 1rem; color: #f87171; }
  h1 { font-size: 1.25rem; margin-bottom: 0.75rem; color: #f1f5f9; }
  p { color: #94a3b8; font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.5rem; }
  a {
    display: inline-block; padding: 0.5rem 1.25rem; border-radius: 6px;
    background: #6366f1; color: #fff; text-decoration: none; font-size: 0.875rem; font-weight: 600;
    transition: background 0.15s;
  }
  a:hover { background: #4f46e5; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#9888;</div>
  <h1>Workspace Unavailable</h1>
  <p>{{ message }}</p>
  <a href="/ui/workspaces">Go to Workspaces</a>
</div>
</body>
</html>
