<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Agent Workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0; display: flex; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0;
  }
  .login-card {
    background: #1e293b; border-radius: 12px; padding: 2.5rem;
    width: 100%; max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f1f5f9; text-align: center; }
  p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.875rem; }
  .form-group { margin-bottom: 1rem; }
  label { display: block; font-size: 0.875rem; margin-bottom: 0.375rem; color: #cbd5e1; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 0.625rem 0.75rem; border: 1px solid #334155;
    border-radius: 6px; background: #0f172a; color: #e2e8f0; font-size: 0.9375rem;
    outline: none; transition: border-color 0.15s;
  }
  input[type="text"]:focus, input[type="password"]:focus { border-color: #6366f1; }
  button {
    width: 100%; padding: 0.625rem; border: none; border-radius: 6px;
    background: #6366f1; color: #fff; font-size: 0.9375rem; font-weight: 600;
    cursor: pointer; transition: background 0.15s; margin-top: 0.5rem;
  }
  button:hover { background: #4f46e5; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #f87171; font-size: 0.8125rem; margin-top: 0.75rem; text-align: center; display: none; }
  .error.visible { display: block; }
</style>
</head>
<body>
<div class="login-card">
  <h1>Agent Workspace</h1>
  <p class="subtitle">Sign in to your workspace</p>
  <form id="login-form">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="login-btn">Sign In</button>
    <div class="error" id="login-error"></div>
    <div id="sso-row" style="display:none;margin-top:1rem;text-align:center">
      <a id="sso-btn" href="/api/oidc/login" style="display:inline-block;width:100%;padding:0.625rem;border-radius:6px;background:#334155;color:#e2e8f0;font-size:0.9375rem;font-weight:600;text-decoration:none;box-sizing:border-box">Sign in with SSO</a>
    </div>
  </form>
</div>
<script>
// Show the SSO button when the control plane has OIDC configured.
fetch("/api/oidc/config")
  .then(r => r.json())
  .then(cfg => { if (cfg.enabled) { document.getElementById("sso-row").style.display = "block"; } })
  .catch(() => {});
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("login-btn");
  const errEl = document.getElementById("login-error");
  btn.disabled = true;
  btn.textContent = "Signing in…";
  errEl.classList.remove("visible");
  errEl.textContent = "";
  try {
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    if (resp.ok) {
      const data = await resp.json();
      window.location.href = data.redirect || "/ui/workspaces";
    } else {
      const data = await resp.json().catch(() => ({}));
      errEl.textContent = data.error || data.detail || "Invalid username or password.";
      errEl.classList.add("visible");
    }
  } catch (err) {
    errEl.textContent = "Network error. Please try again.";
    errEl.classList.add("visible");
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
});
</script>
</body>
</html>
