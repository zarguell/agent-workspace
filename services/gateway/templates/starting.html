<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="5">
<title>Starting Workspace — Agent Workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0; display: flex; align-items: center;
    justify-content: center; min-height: 100vh; margin: 0;
  }
  .card {
    background: #1e293b; border-radius: 12px; padding: 2.5rem;
    width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    text-align: center;
  }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 1.5rem;
    border: 3px solid #334155; border-top-color: #6366f1;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; margin-bottom: 0.75rem; color: #f1f5f9; }
  p { color: #94a3b8; font-size: 0.875rem; line-height: 1.5; }
  p.note { margin-top: 1rem; font-size: 0.75rem; color: #64748b; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1>Your workspace is starting</h1>
  <p>Please wait while we prepare your environment. This page will refresh automatically when it is ready.</p>
  <p class="note">First-time setup may take up to 60 seconds.</p>
</div>
</body>
</html>
