<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspaces — Agent Workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh;
  }
  .header {
    background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 1.25rem; color: #f1f5f9; }
  .logout-btn {
    background: none; border: 1px solid #475569; color: #94a3b8;
    padding: 0.375rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8125rem;
  }
  .logout-btn:hover { border-color: #64748b; color: #e2e8f0; }
  .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  .card {
    background: #1e293b; border-radius: 10px; padding: 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  .card h2 { font-size: 1.125rem; margin-bottom: 0.25rem; }
  .card .meta { font-size: 0.8125rem; color: #64748b; }
  .badge {
    display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px;
    font-size: 0.75rem; font-weight: 600;
  }
  .badge.running { background: #065f46; color: #6ee7b7; }
  .badge.hibernated { background: #451a03; color: #fbbf24; }
  .badge.starting { background: #1e3a5f; color: #93c5fd; }
  .actions { display: flex; gap: 0.5rem; }
  .btn {
    padding: 0.5rem 1rem; border: none; border-radius: 6px;
    font-size: 0.8125rem; font-weight: 500; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }
  .btn-warning { background: #92400e; color: #fde68a; }
  .btn-warning:hover { background: #b45309; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .loading { text-align: center; padding: 3rem; color: #64748b; }
  .error-card { background: #7f1d1d; border-radius: 10px; padding: 1.5rem; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1>Agent Workspaces</h1>
  <button class="logout-btn" id="logout-btn">Sign Out</button>
</div>
<div class="container" id="workspace-list">
  <div class="loading">Loading workspaces…</div>
</div>

<script>
async function logout() {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/ui/login";
}
document.getElementById("logout-btn").addEventListener("click", logout);

async function loadWorkspaces() {
  const el = document.getElementById("workspace-list");
  try {
    const resp = await fetch("/api/workspaces");
    if (resp.status === 401) { window.location.href = "/ui/login"; return; }
    if (!resp.ok) { throw new Error(await resp.text()); }
    const workspaces = await resp.json();
    if (workspaces.length === 0) {
      el.innerHTML = '<p style="text-align:center;color:#64748b">No workspaces found.</p>';
      return;
    }
    el.innerHTML = workspaces.map(ws => {
      const state = ws.state;
      const badgeClass = { running: "running", starting: "starting", hibernated: "hibernated" }[state] || "";
      return `<div class="card">
        <div>
          <h2>${ws.username || ws.workspace_id}</h2>
          <div class="meta">
            <span class="badge ${badgeClass}">${state}</span>
            Created: ${new Date(ws.created_at).toLocaleString()}
          </div>
        </div>
        <div class="actions">
          ${state === "hibernated" ? `<button class="btn btn-primary" onclick="startWorkspace('${ws.workspace_id}')">Start</button>` : ""}
          ${state === "running" ? `<a class="btn btn-primary" href="/canvas/">Open Canvas</a><a class="btn btn-secondary" href="/code/">Open Code</a>` : ""}
          ${state === "starting" ? `<span class="btn btn-secondary" disabled>Starting…</span>` : ""}
          ${state === "running" ? `<button class="btn btn-warning" onclick="hibernateWorkspace('${ws.workspace_id}')">Hibernate</button>` : ""}
        </div>
      </div>`;
    }).join("");
  } catch (err) {
    el.innerHTML = `<div class="error-card">Failed to load workspaces: ${err.message}</div>`;
  }
}

async function startWorkspace(id) {
  await fetch(`/api/workspaces/${id}/start`, { method: "POST" });
  // Poll workspace status every 3s until it transitions to running
  const poll = setInterval(async () => {
    try {
      const r = await fetch(`/api/workspaces/${id}/status`);
      const ws = await r.json();
      if (ws.state === "running") {
        clearInterval(poll);
        loadWorkspaces();
      } else if (ws.state === "hibernated" || ws.state === "failed") {
        clearInterval(poll);
        loadWorkspaces();
      }
    } catch(e) { /* retry on next interval */ }
  }, 3000);
  loadWorkspaces();
}

async function hibernateWorkspace(id) {
  await fetch(`/api/workspaces/${id}/hibernate`, { method: "POST" });
  loadWorkspaces();
}

loadWorkspaces();
// Poll for workspace updates every 5s if any workspace is starting/hibernating
setInterval(async () => {
  try {
    const r = await fetch("/api/workspaces");
    const wsList = await r.json();
    const needsUpdate = wsList.some(w => w.state === "starting" || w.state === "hibernating");
    if (needsUpdate) loadWorkspaces();
  } catch(e) {}
}, 5000);
</script>
</body>
</html>
