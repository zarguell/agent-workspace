<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspaces — Agent Workspace</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh;
  }
  .header {
    background: #1e293b; border-bottom: 1px solid #334155; padding: 1rem 2rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 1.25rem; color: #f1f5f9; }
  .header .nav { display: flex; gap: 1rem; align-items: center; }
  .nav a, .logout-btn {
    background: none; border: 1px solid #475569; color: #94a3b8;
    padding: 0.375rem 0.75rem; border-radius: 6px; cursor: pointer;
    font-size: 0.8125rem; text-decoration: none; display: inline-block;
  }
  .nav a:hover, .logout-btn:hover { border-color: #64748b; color: #e2e8f0; }
  .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  .card {
    background: #1e293b; border-radius: 10px; padding: 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;
  }
  .card h2 { font-size: 1.125rem; margin-bottom: 0.25rem; }
  .card .meta { font-size: 0.8125rem; color: #64748b; }
  .badge {
    display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px;
    font-size: 0.75rem; font-weight: 600;
  }
  .badge.running { background: #065f46; color: #6ee7b7; }
  .badge.hibernated { background: #451a03; color: #fbbf24; }
  .badge.starting { background: #1e3a5f; color: #93c5fd; }
  .badge.shared { background: #312e81; color: #a5b4fc; }
  .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .btn {
    padding: 0.5rem 1rem; border: none; border-radius: 6px;
    font-size: 0.8125rem; font-weight: 500; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }
  .btn-warning { background: #92400e; color: #fde68a; }
  .btn-warning:hover { background: #b45309; }
  .btn-danger { background: #7f1d1d; color: #fecaca; }
  .btn-danger:hover { background: #991b1b; }
  .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .loading { text-align: center; padding: 3rem; color: #64748b; }
  .error-card { background: #7f1d1d; border-radius: 10px; padding: 1.5rem; text-align: center; }
  .share-panel {
    flex-basis: 100%; border-top: 1px solid #334155; padding-top: 0.75rem;
    font-size: 0.875rem;
  }
  .share-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.375rem 0;
  }

  .share-row .perm { color: #64748b; font-size: 0.75rem; }
  .add-share { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .add-share select {
    padding: 0.375rem 0.5rem; border: 1px solid #334155; border-radius: 6px;
    background: #0f172a; color: #e2e8f0; font-size: 0.8125rem; outline: none;
  }
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
    background: #065f46; color: #d1fae5; padding: 0.625rem 1.25rem;
    border-radius: 8px; font-size: 0.875rem; display: none; z-index: 10;
  }
</style>
</head>
<body>
<div class="header">
  <h1>Agent Workspaces</h1>
  <div class="nav">
    <a href="/ui/groups">Groups</a>
    <button class="logout-btn" id="logout-btn">Sign Out</button>
</div>
</div>
<div class="container" id="workspace-list">
  <div class="loading">Loading workspaces…</div>
</div>
<div class="container" id="usage-summary"></div>
<div class="toast" id="toast"></div>

<script>
const esc = (s) => CSS.escape(s);
let me = null; // current user id (from /api/session)

async function logout() {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/ui/login";
}
document.getElementById("logout-btn").addEventListener("click", logout);

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 2500);
}

async function api(path, opts) {
  const resp = await fetch(path, opts);
  if (resp.status === 401) { window.location.href = "/ui/login"; throw new Error("unauthorized"); }
  return resp;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// Select a workspace for /canvas/ and /code/: plain links can't set the
// X-Workspace-Id header, so the gateway also honors this cookie.
function openWorkspace(id, href) {
  document.cookie = `workspace=${id}; path=/; max-age=21600`;
  window.location.href = href;
}

async function loadWorkspaces() {
  const el = document.getElementById("workspace-list");
  try {
    const sessionResp = await api("/api/session");
    const session = await sessionResp.json();
    me = session.user_id;

    const resp = await api("/api/workspaces");
    const workspaces = await resp.json();
    if (workspaces.length === 0) {
      el.innerHTML = '<p style="text-align:center;color:#64748b">No workspaces found.</p>';
      return;
    }
    el.innerHTML = "";
    for (const ws of workspaces) {
      el.appendChild(workspaceCard(ws));
    }
  } catch (err) {
    el.innerHTML = `<div class="error-card">Failed to load workspaces: ${err.message}</div>`;
  }
}

function workspaceCard(ws) {
  const state = ws.state;
  const badgeClass = { running: "running", starting: "starting", hibernated: "hibernated" }[state] || "";
  const isOwn = ws.user_id === me;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div>
      <h2>${escapeHtml(ws.username || ws.workspace_id)}</h2>
      <div class="meta">
        <span class="badge ${badgeClass}">${state}</span>
        ${isOwn ? "" : `<span class="badge shared">Shared</span>`}
        <span>${ws.workspace_id}</span>
        · Created: ${new Date(ws.created_at).toLocaleString()}
      </div>
    </div>
    <div class="actions">
      ${state === "hibernated" ? `<button class="btn btn-primary" onclick="startWorkspace('${ws.workspace_id}')">Start</button>` : ""}
      ${state === "running" ? `<button class="btn btn-primary" onclick="openWorkspace('${ws.workspace_id}', '/canvas/')">Open Canvas</button><button class="btn btn-secondary" onclick="openWorkspace('${ws.workspace_id}', '/code/')">Open Code</button>` : ""}
      ${state === "starting" ? `<span class="btn btn-secondary" disabled>Starting…</span>` : ""}
      ${state === "running" ? `<button class="btn btn-warning" onclick="hibernateWorkspace('${ws.workspace_id}')">Hibernate</button>` : ""}
      ${isOwn ? `<button class="btn btn-secondary" id="share-toggle-${ws.workspace_id}">Sharing</button><button class="btn btn-secondary" id="mcp-toggle-${ws.workspace_id}">MCP Servers</button><button class="btn btn-secondary" id="secrets-toggle-${ws.workspace_id}">Secrets</button>` : ""}
    </div>
    ${isOwn ? `<div class="share-panel" id="mcp-panel-${ws.workspace_id}" hidden>
      <div id="mcp-rows-${ws.workspace_id}"></div>
      <div class="add-share">
        <input type="text" id="mcp-name-${ws.workspace_id}" placeholder="name" style="padding:0.375rem 0.5rem;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:0.8125rem">
        <input type="number" id="mcp-port-${ws.workspace_id}" placeholder="port" min="1" max="65535" value="3001" style="width:5rem;padding:0.375rem 0.5rem;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:0.8125rem">
        <button class="btn btn-secondary btn-sm" id="mcp-add-${ws.workspace_id}">Register</button>
      </div>
    </div>` : ""}
    ${isOwn ? `<div class="share-panel" id="secrets-panel-${ws.workspace_id}" hidden>
      <div id="secrets-rows-${ws.workspace_id}"></div>
      <div class="add-share">
        <input type="text" id="secrets-key-${ws.workspace_id}" placeholder="key (e.g. GITHUB_TOKEN)" style="padding:0.375rem 0.5rem;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:0.8125rem">
        <input type="password" id="secrets-value-${ws.workspace_id}" placeholder="value" style="padding:0.375rem 0.5rem;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:0.8125rem;flex:1">
        <button class="btn btn-secondary btn-sm" id="secrets-add-${ws.workspace_id}">Save</button>
      </div>
    </div>` : ""}
    ${isOwn ? `<div class="share-panel" id="share-panel-${ws.workspace_id}" hidden>
      <div id="share-rows-${ws.workspace_id}"></div>
      <div class="add-share">
        <select id="share-group-${ws.workspace_id}"></select>
        <select id="share-perm-${ws.workspace_id}">
          <option value="view">view</option>
          <option value="operate">operate</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="share-add-${ws.workspace_id}">Share</button>
      </div>
    </div>` : ""}`;

  if (isOwn) {
    const toggle = card.querySelector(`#share-toggle-${esc(ws.workspace_id)}`);
    const panel = card.querySelector(`#share-panel-${esc(ws.workspace_id)}`);
    toggle.addEventListener("click", async () => {
      panel.hidden = !panel.hidden;
      if (!panel.hidden) {
        await loadShares(ws.workspace_id, card);
        await loadShareGroups(ws.workspace_id, card);
      }
    });
    card.querySelector(`#share-add-${esc(ws.workspace_id)}`).addEventListener("click", () => addShare(ws.workspace_id, card));

    const mcpToggle = card.querySelector(`#mcp-toggle-${esc(ws.workspace_id)}`);
    const mcpPanel = card.querySelector(`#mcp-panel-${esc(ws.workspace_id)}`);
    mcpToggle.addEventListener("click", async () => {
      mcpPanel.hidden = !mcpPanel.hidden;
      if (!mcpPanel.hidden) {
        await loadMcpServers(ws.workspace_id, card);
      }
    });
    card.querySelector(`#mcp-add-${esc(ws.workspace_id)}`).addEventListener("click", () => addMcpServer(ws.workspace_id, card));

    const secretsToggle = card.querySelector(`#secrets-toggle-${esc(ws.workspace_id)}`);
    const secretsPanel = card.querySelector(`#secrets-panel-${esc(ws.workspace_id)}`);
    secretsToggle.addEventListener("click", async () => {
      secretsPanel.hidden = !secretsPanel.hidden;
      if (!secretsPanel.hidden) {
        await loadSecrets(ws.workspace_id, card);
      }
    });
    card.querySelector(`#secrets-add-${esc(ws.workspace_id)}`).addEventListener("click", () => addSecret(ws.workspace_id, card));
  }
  return card;
}

async function loadSecrets(id, card) {
  const rows = card.querySelector(`#secrets-rows-${esc(id)}`);
  try {
    const resp = await api(`/api/workspaces/${id}/secrets`);
    const secrets = await resp.json();
    rows.innerHTML = "";
    if (secrets.length === 0) {
      rows.innerHTML = '<span style="color:#64748b">No secrets set.</span>';
      return;
    }
    for (const s of secrets) {
      const row = document.createElement("div");
      row.className = "share-row";
      row.innerHTML = `
        <span>${escapeHtml(s.key)}</span>
        <button class="btn btn-danger btn-sm" data-secret-remove="${s.key}">Remove</button>`;
      row.querySelector(`[data-secret-remove="${s.key}"]`).addEventListener("click", async () => {
        await api(`/api/workspaces/${id}/secrets/${encodeURIComponent(s.key)}`, { method: "DELETE" });
        toast(`Secret ${s.key} removed`);
        loadSecrets(id, card);
      });
      rows.appendChild(row);
    }
  } catch (err) {
    rows.innerHTML = '<span class="perm">Could not load secrets</span>';
  }
}

async function addSecret(id, card) {
  const key = card.querySelector(`#secrets-key-${esc(id)}`).value.trim();
  const value = card.querySelector(`#secrets-value-${esc(id)}`).value;
  if (!key || !value) { toast("Key and value required"); return; }
  const resp = await api(`/api/workspaces/${id}/secrets/${encodeURIComponent(key)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ value }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    toast(data.error || "Could not save secret");
    return;
  }
  card.querySelector(`#secrets-key-${esc(id)}`).value = "";
  card.querySelector(`#secrets-value-${esc(id)}`).value = "";
  toast(`Secret ${key} saved`);
  loadSecrets(id, card);
}

async function loadMcpServers(id, card) {
  const rows = card.querySelector(`#mcp-rows-${esc(id)}`);
  try {
    const resp = await api(`/api/workspaces/${id}/mcp-servers`);
    const servers = await resp.json();
    rows.innerHTML = "";
    if (servers.length === 0) {
      rows.innerHTML = '<span style="color:#64748b">No MCP servers registered.</span>';
      return;
    }
    for (const s of servers) {
      const row = document.createElement("div");
      row.className = "share-row";
      row.innerHTML = `
        <span>${escapeHtml(s.name)} <span class="perm">:${s.port} ${s.enabled ? "" : "(disabled)"}</span></span>
        <span>
          <button class="btn btn-secondary btn-sm" data-mcp-toggle="${s.server_id}">${s.enabled ? "Disable" : "Enable"}</button>
          <button class="btn btn-danger btn-sm" data-mcp-remove="${s.server_id}">Remove</button>
        </span>`;
      row.querySelector(`[data-mcp-toggle="${s.server_id}"]`).addEventListener("click", async () => {
        await api(`/api/workspaces/${id}/mcp-servers/${s.server_id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: !s.enabled }),
        });
        loadMcpServers(id, card);
      });
      row.querySelector(`[data-mcp-remove="${s.server_id}"]`).addEventListener("click", async () => {
        await api(`/api/workspaces/${id}/mcp-servers/${s.server_id}`, { method: "DELETE" });
        toast("MCP server removed");
        loadMcpServers(id, card);
      });
      rows.appendChild(row);
    }
  } catch (err) {
    rows.innerHTML = '<span class="perm">Could not load MCP servers</span>';
  }
}

async function addMcpServer(id, card) {
  const name = card.querySelector(`#mcp-name-${esc(id)}`).value.trim();
  const port = parseInt(card.querySelector(`#mcp-port-${esc(id)}`).value, 10);
  if (!name || !port) { toast("Name and port required"); return; }
  const resp = await api(`/api/workspaces/${id}/mcp-servers`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, port }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    toast(data.error || "Could not register MCP server");
    return;
  }
  card.querySelector(`#mcp-name-${esc(id)}`).value = "";
  toast("MCP server registered");
  loadMcpServers(id, card);
}

async function loadUsageSummary() {
  const el = document.getElementById("usage-summary");
  try {
    const resp = await api("/api/usage/summary");
    const s = await resp.json();
    const tokens = s.totals.tokens || 0;
    const quota = s.max_monthly_tokens;
    const line = quota == null
      ? `Tokens this month: ${tokens.toLocaleString()} (no quota)`
      : `Tokens this month: ${tokens.toLocaleString()} / ${quota.toLocaleString()}`
        + (s.quota_exceeded ? " — quota exceeded" : "");
    el.innerHTML = `<p style="text-align:center;color:#64748b;font-size:0.8125rem">${line}</p>`;
  } catch (err) {
    el.innerHTML = "";
  }
}

async function loadShares(id, card) {
  const rows = card.querySelector(`#share-rows-${esc(id)}`);
  try {
    const resp = await api(`/api/workspaces/${id}/shares`);
    const shares = await resp.json();
    rows.innerHTML = "";
    if (shares.length === 0) {
      rows.innerHTML = '<span style="color:#64748b">Not shared with any group.</span>';
      return;
    }
    for (const s of shares) {
      const row = document.createElement("div");
      row.className = "share-row";
      row.innerHTML = `
        <span>${escapeHtml(s.group_name)} <span class="perm">(${s.permission})</span></span>
        <button class="btn btn-danger btn-sm" data-unshare="${s.group_id}">Unshare</button>`;
      row.querySelector(`[data-unshare="${s.group_id}"]`).addEventListener("click", async () => {
        await api(`/api/workspaces/${id}/shares/${s.group_id}`, { method: "DELETE" });
        toast(`Unshared with ${s.group_name}`);
        loadShares(id, card);
      });
      rows.appendChild(row);
    }
  } catch (err) {
    rows.innerHTML = '<span class="perm">Could not load shares</span>';
  }
}

async function loadShareGroups(id, card) {
  const sel = card.querySelector(`#share-group-${esc(id)}`);
  try {
    const resp = await api("/api/groups");
    const groups = await resp.json();
    sel.innerHTML = "";
    if (groups.length === 0) {
      sel.innerHTML = '<option value="">No groups — create one first</option>';
      return;
    }
    for (const g of groups) {
      const opt = document.createElement("option");
      opt.value = g.group_id;
      opt.textContent = g.name;
      sel.appendChild(opt);
    }
  } catch (err) {
    sel.innerHTML = '<option value="">Could not load groups</option>';
  }
}

async function addShare(id, card) {
  const groupId = card.querySelector(`#share-group-${esc(id)}`).value;
  if (!groupId) { toast("Create a group first"); return; }
  const permission = card.querySelector(`#share-perm-${esc(id)}`).value;
  const resp = await api(`/api/workspaces/${id}/shares`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ group_id: groupId, permission }),
  });
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    toast(data.error || "Could not share");
    return;
  }
  toast("Workspace shared");
  loadShares(id, card);
}

async function startWorkspace(id) {
  await api(`/api/workspaces/${id}/start`, { method: "POST" });
  // Poll workspace status every 3s until it transitions to running
  const poll = setInterval(async () => {
    try {
      const r = await fetch(`/api/workspaces/${id}/status`);
      const ws = await r.json();
      if (ws.state === "running") {
        clearInterval(poll);
        loadWorkspaces();
      } else if (ws.state === "hibernated" || ws.state === "failed") {
        clearInterval(poll);
        loadWorkspaces();
      }
    } catch(e) { /* retry on next interval */ }
  }, 3000);
  loadWorkspaces();
}

async function hibernateWorkspace(id) {
  await api(`/api/workspaces/${id}/hibernate`, { method: "POST" });
  loadWorkspaces();
}

loadWorkspaces();
loadUsageSummary();
// Poll for workspace updates every 5s if any workspace is starting/hibernating
setInterval(async () => {
  try {
    const r = await fetch("/api/workspaces");
    const wsList = await r.json();
    const needsUpdate = wsList.some(w => w.state === "starting" || w.state === "hibernating");
    if (needsUpdate) loadWorkspaces();
  } catch(e) {}
}, 5000);
</script>
</body>
</html>
